name: Fuelly CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test:run
      - name: Build
        run: pnpm build